name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: generate trophy
    steps:
      - name: Generate trophy image
        uses: ryo-ma/github-profile-trophy@1.0.6
        with:
          username: muhammadlakho50
          output: trophy/github-profile-trophy.svg
          theme: radical
          no-frame: "false"
          no-bg: "true"
          margin-w: "4"

      - name: Commit and push generated file
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f trophy/
          git commit -m "Update trophy image" || echo "no changes"
          git push
