name: Generate Isometric Contribution City

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: isometric-city
    steps:
      - name: Generate isometric contribution city SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: isometric-city.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Checkout repo to commit the file
        uses: actions/checkout@v4

      - name: Move generated file into place and push
        run: |
          mkdir -p isometric-city
          mv isometric-city.svg isometric-city/isometric-city.svg
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f isometric-city/
          git commit -m "Update isometric contribution city" || echo "no changes"
          git push
