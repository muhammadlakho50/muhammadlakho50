<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .grid-line { stroke: #1f2937; stroke-width: 1; opacity: 0.4; }
      .name-main {
        font-family: 'Courier New', monospace;
        font-size: 48px;
        font-weight: bold;
        fill: #39ff14;
        text-anchor: middle;
      }
      .name-glitch-r {
        font-family: 'Courier New', monospace;
        font-size: 48px;
        font-weight: bold;
        fill: #ff003c;
        text-anchor: middle;
        opacity: 0.7;
        animation: glitch-r 2.5s infinite linear;
      }
      .name-glitch-b {
        font-family: 'Courier New', monospace;
        font-size: 48px;
        font-weight: bold;
        fill: #00e5ff;
        text-anchor: middle;
        opacity: 0.7;
        animation: glitch-b 2.5s infinite linear;
      }
      .subtitle {
        font-family: 'Courier New', monospace;
        font-size: 20px;
        fill: #58a6ff;
        text-anchor: middle;
        animation: flicker 3s infinite;
      }
      @keyframes glitch-r {
        0%, 90%, 100% { transform: translate(0, 0); opacity: 0; }
        92% { transform: translate(-3px, 1px); opacity: 0.8; }
        94% { transform: translate(2px, -1px); opacity: 0.6; }
        96% { transform: translate(-1px, 0); opacity: 0; }
      }
      @keyframes glitch-b {
        0%, 90%, 100% { transform: translate(0, 0); opacity: 0; }
        91% { transform: translate(3px, -1px); opacity: 0.8; }
        95% { transform: translate(-2px, 1px); opacity: 0.6; }
        97% { transform: translate(1px, 0); opacity: 0; }
      }
      @keyframes flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
        20%, 22%, 24%, 55% { opacity: 0.4; }
      }
    </style>
  </defs>

  <rect class="bg" width="800" height="200"/>

  <line class="grid-line" x1="0" y1="40" x2="800" y2="40"/>
  <line class="grid-line" x1="0" y1="80" x2="800" y2="80"/>
  <line class="grid-line" x1="0" y1="120" x2="800" y2="120"/>
  <line class="grid-line" x1="0" y1="160" x2="800" y2="160"/>

  <text class="name-glitch-r" x="400" y="95">MUHAMMAD LAKHO</text>
  <text class="name-glitch-b" x="400" y="95">MUHAMMAD LAKHO</text>
  <text class="name-main" x="400" y="95">MUHAMMAD LAKHO</text>

  <text class="subtitle" x="400" y="140">&gt; problem_solving.exe --run --target=cybersecurity</text>
</svg>
