<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f2027"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- Network topology, left side: routers pulsing and lines drawing in -->
  <g stroke="#00F5D4" stroke-width="1.4" fill="none" opacity="0.55">
    <line x1="60" y1="60" x2="150" y2="110">
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="110" x2="60" y2="160">
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="110" x2="240" y2="60">
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="110" x2="240" y2="160">
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
    </line>
  </g>

  <g>
    <circle cx="60" cy="60" r="6" fill="#00F5D4">
      <animate attributeName="r" values="6;9;6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="110" r="8" fill="#58A6FF">
      <animate attributeName="r" values="8;12;8" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="160" r="6" fill="#00F5D4">
      <animate attributeName="r" values="6;9;6" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="60" r="6" fill="#00F5D4">
      <animate attributeName="r" values="6;9;6" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="160" r="6" fill="#00F5D4">
      <animate attributeName="r" values="6;9;6" dur="1.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Data packet traveling along the topology -->
  <circle r="3.5" fill="#ffffff" filter="url(#softGlow)">
    <animateMotion dur="3s" repeatCount="indefinite"
      path="M60,60 L150,110 L240,60 M240,60 L150,110 L60,160 M60,160 L150,110 L240,160"/>
  </circle>

  <!-- Center: name with terminal-style reveal -->
  <text x="450" y="95" text-anchor="middle" font-family="Fira Code, monospace" font-size="34" fill="#ffffff" font-weight="600">
    <tspan fill="#00F5D4">&gt;_</tspan> Muhammad Bilawal
  </text>
  <text x="450" y="128" text-anchor="middle" font-family="Fira Code, monospace" font-size="15" fill="#8b949e">
    Networks. Code. Football.
  </text>
  <rect x="330" y="138" width="240" height="1.5" fill="#00F5D4" opacity="0.5">
    <animate attributeName="width" values="0;240;240;0" keyTimes="0;0.4;0.8;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Right side: football + trajectory arc, nod to FullTimeFC -->
  <g transform="translate(760,110)">
    <circle r="0" fill="none" stroke="#00F5D4" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="0;70" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      <circle r="22" fill="#f5f5f5"/>
      <path d="M0,-22 L6,-8 L-6,-8 Z" fill="#0d1117"/>
      <path d="M20,-6 L10,4 L14,16 Z" fill="#0d1117"/>
      <path d="M-20,-6 L-10,4 L-14,16 Z" fill="#0d1117"/>
      <path d="M0,22 L-8,10 L8,10 Z" fill="#0d1117"/>
    </g>
    <text x="0" y="55" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#8b949e">FullTimeFC</text>
  </g>

  <circle cx="450" cy="20" r="60" fill="url(#glow)" opacity="0.3"/>
</svg>
